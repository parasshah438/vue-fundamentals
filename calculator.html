<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bootstrap 5 jQuery Calculator</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #f8f9fa, #e9ecef);
      min-height: 100vh;
    }

    .calculator-card {
      max-width: 380px;
      border: 0;
      border-radius: 1rem;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
    }

    .calculator-display {
      height: 80px;
      font-size: 2rem;
      font-weight: 600;
      text-align: right;
      background: #212529;
      color: #fff;
      border: none;
      border-radius: 0.75rem;
    }

    .btn-calc {
      height: 60px;
      font-size: 1.2rem;
      font-weight: 600;
      border-radius: 0.75rem;
    }

    .btn-operator {
      background-color: #ff9800;
      color: #fff;
      border: none;
    }

    .btn-operator:hover {
      background-color: #fb8c00;
      color: #fff;
    }

    .btn-equal {
      background-color: #198754;
      color: #fff;
      border: none;
    }

    .btn-equal:hover {
      background-color: #157347;
      color: #fff;
    }

    .btn-clear {
      background-color: #dc3545;
      color: #fff;
      border: none;
    }

    .btn-clear:hover {
      background-color: #bb2d3b;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
    <div class="card calculator-card w-100">
      <div class="card-body p-4">
        <h3 class="text-center mb-3">Calculator</h3>

        <input type="text" id="display" class="form-control calculator-display mb-3" value="0" readonly>

        <div class="row g-2">
          <div class="col-3"><button class="btn btn-clear btn-calc w-100" data-value="C">C</button></div>
          <div class="col-3"><button class="btn btn-secondary btn-calc w-100" data-value="⌫">⌫</button></div>
          <div class="col-3"><button class="btn btn-secondary btn-calc w-100 operator" data-value="%">%</button></div>
          <div class="col-3"><button class="btn btn-operator btn-calc w-100 operator" data-value="/">÷</button></div>

          <div class="col-3"><button class="btn btn-light btn-calc w-100 number" data-value="7">7</button></div>
          <div class="col-3"><button class="btn btn-light btn-calc w-100 number" data-value="8">8</button></div>
          <div class="col-3"><button class="btn btn-light btn-calc w-100 number" data-value="9">9</button></div>
          <div class="col-3"><button class="btn btn-operator btn-calc w-100 operator" data-value="*">×</button></div>

          <div class="col-3"><button class="btn btn-light btn-calc w-100 number" data-value="4">4</button></div>
          <div class="col-3"><button class="btn btn-light btn-calc w-100 number" data-value="5">5</button></div>
          <div class="col-3"><button class="btn btn-light btn-calc w-100 number" data-value="6">6</button></div>
          <div class="col-3"><button class="btn btn-operator btn-calc w-100 operator" data-value="-">−</button></div>

          <div class="col-3"><button class="btn btn-light btn-calc w-100 number" data-value="1">1</button></div>
          <div class="col-3"><button class="btn btn-light btn-calc w-100 number" data-value="2">2</button></div>
          <div class="col-3"><button class="btn btn-light btn-calc w-100 number" data-value="3">3</button></div>
          <div class="col-3"><button class="btn btn-operator btn-calc w-100 operator" data-value="+">+</button></div>

          <div class="col-6"><button class="btn btn-light btn-calc w-100 number" data-value="0">0</button></div>
          <div class="col-3"><button class="btn btn-light btn-calc w-100 number" data-value=".">.</button></div>
          <div class="col-3"><button class="btn btn-equal btn-calc w-100" id="equals">=</button></div>
        </div>
      </div>
    </div>
  </div>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    $(document).ready(function () {
      let expression = "";

      function updateDisplay(value) {
        $("#display").val(value || "0");
      }

      function appendValue(value) {
        // Prevent multiple operators in a row (except minus for negative values)
        const lastChar = expression.slice(-1);
        const operators = ["+", "-", "*", "/", "%"];

        if (operators.includes(value)) {
          if (expression === "" && value !== "-") return;

          if (operators.includes(lastChar)) {
            expression = expression.slice(0, -1) + value;
          } else {
            expression += value;
          }
        } else if (value === ".") {
          // Avoid multiple dots in the same number segment
          const parts = expression.split(/[\+\-\*\/%]/);
          const currentPart = parts[parts.length - 1];
          if (currentPart.includes(".")) return;

          // If expression is empty or last char is an operator, prefix 0.
          if (expression === "" || operators.includes(lastChar)) {
            expression += "0.";
          } else {
            expression += ".";
          }
        } else {
          if (expression === "0") expression = "";
          expression += value;
        }

        updateDisplay(expression);
      }

      $(".number, .operator").on("click", function () {
        appendValue($(this).data("value").toString());
      });

      $("#equals").on("click", function () {
        try {
          if (!expression) return;

          // Replace the percentage symbol with division by 100 for simple evaluation.
          let evalExpression = expression.replace(/%/g, "/100");

          // Evaluate the expression safely for this simple calculator
          const result = Function('"use strict"; return (' + evalExpression + ')')();

          expression = String(result);
          updateDisplay(expression);
        } catch (error) {
          updateDisplay("Error");
          expression = "";
        }
      });

      $(".btn-clear").on("click", function () {
        expression = "";
        updateDisplay("0");
      });

      // Backspace button
      $('[data-value="⌫"]').on("click", function () {
        expression = expression.slice(0, -1);
        updateDisplay(expression);
      });

      // Keyboard support
      $(document).on("keydown", function (e) {
        const key = e.key;

        if ((key >= "0" && key <= "9") || ["+", "-", "*", "/", "%", "."].includes(key)) {
          appendValue(key);
        } else if (key === "Enter" || key === "=") {
          e.preventDefault();
          $("#equals").click();
        } else if (key === "Backspace") {
          expression = expression.slice(0, -1);
          updateDisplay(expression);
        } else if (key === "Escape") {
          expression = "";
          updateDisplay("0");
        }
      });
    });
  </script>
</body>
</html>
